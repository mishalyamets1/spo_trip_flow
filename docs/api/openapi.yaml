{
  "openapi": "3.1.0",
  "info":
    {
      "title": "TripFlow API",
      "version": "0.5.0",
      "description": "Учебная версия с администрированием. Все изменяющие запросы требуют Content-Type application/json и Origin из разрешённого списка APP_ORIGIN. Для локального APP_ORIGIN разрешены localhost и 127.0.0.1 на настроенном порту, также в Docker. В режиме разработки дополнительно разрешены оба имени на портах 3000/3001. Сессия в HttpOnly cookie на 8 часов; SameSite=Lax, Secure при COOKIE_SECURE=true. Идентификаторы BIGINT и суммы NUMERIC передаются строками. Ошибочный JSON: 400, слишком большой запрос: 413, неверный Content-Type: 415. Чужие заявки скрыты ответом 404. Отмена заявки доступна автору до первого решения. Администрирование /admin/* доступно только роли ADMIN; действия записываются в журнал.",
    },
  "servers": [{ "url": "/api" }],
  "security": [{ "session": [] }],
