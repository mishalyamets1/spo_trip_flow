  "components":
    {
      "securitySchemes":
        {
          "session":
            { "type": "apiKey", "in": "cookie", "name": "tripflow_session" },
        },
      "schemas":
        {
          "Id":
            {
              "type": "string",
              "pattern": "^[1-9][0-9]{0,17}$",
              "example": "12",
            },
          "Expense":
            {
              "type": "object",
              "required": ["category_id", "amount"],
              "properties":
                {
                  "category_id": { "$ref": "#/components/schemas/Id" },
                  "amount":
                    {
                      "type": "string",
                      "pattern": "^\\d{1,12}(\\.\\d{1,2})?$",
                      "example": "12000.00",
                    },
                  "description": { "type": "string", "maxLength": 300 },
                },
            },
          "Error":
            {
              "type": "object",
              "required": ["error"],
              "properties":
                {
                  "error":
                    {
                      "type": "object",
                      "required": ["message"],
                      "properties":
                        {
                          "message": { "type": "string" },
                          "requestId": { "type": "string" },
                          "fields":
                            {
                              "type": "array",
                              "items":
                                {
                                  "type": "object",
                                  "properties":
                                    {
                                      "path": { "type": "string" },
                                      "message": { "type": "string" },
                                    },
                                },
                            },
                        },
                    },
                },
            },
          "User":
            {
              "type": "object",
              "properties":
                {
                  "id": { "$ref": "#/components/schemas/Id" },
                  "employee_id": { "$ref": "#/components/schemas/Id" },
                  "email": { "type": "string", "format": "email" },
                  "full_name": { "type": "string" },
                  "roles":
                    {
                      "type": "array",
                      "items": { "enum": ["EMPLOYEE", "APPROVER", "ADMIN"] },
                    },
                },
            },
          "RequestInput":
            {
              "type": "object",
              "required":
                [
                  "destination_country",
                  "destination_city",
                  "purpose",
                  "start_date",
                  "end_date",
                  "transport_type",
                  "accommodation_required",
                  "currency",
                  "expenses",
                ],
              "properties":
                {
                  "destination_country":
                    { "type": "string", "minLength": 1, "maxLength": 100 },
                  "destination_city":
                    { "type": "string", "minLength": 1, "maxLength": 120 },
                  "purpose":
                    { "type": "string", "minLength": 10, "maxLength": 1000 },
                  "start_date": { "type": "string", "format": "date" },
                  "end_date": { "type": "string", "format": "date" },
                  "transport_type":
                    { "enum": ["AIR", "RAIL", "CAR", "BUS", "OTHER"] },
                  "accommodation_required": { "type": "boolean" },
                  "currency": { "type": "string", "enum": ["RUB"] },
                  "employee_comment": { "type": "string", "maxLength": 2000 },
                  "expenses":
                    {
                      "type": "array",
                      "maxItems": 100,
                      "items": { "$ref": "#/components/schemas/Expense" },
                    },
                  "version": { "type": "integer", "minimum": 1 },
                },
            },
          "RequestUpdate":
            {
              "allOf":
                [
                  { "$ref": "#/components/schemas/RequestInput" },
                  { "type": "object", "required": ["version"] },
                ],
            },
          "Version":
            {
              "type": "object",
              "required": ["version"],
              "properties": { "version": { "type": "integer", "minimum": 1 } },
            },
          "Decision":
            {
              "type": "object",
              "required": ["version"],
              "properties":
                {
                  "version": { "type": "integer", "minimum": 1 },
                  "comment":
                    {
                      "type": "string",
                      "maxLength": 2000,
                      "description": "Непустой после trim для reject",
