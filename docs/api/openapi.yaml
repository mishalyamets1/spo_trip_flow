              "description": "Удаляет сотрудника, аккаунт и все его заявки со сметами, поездками, этапами и историей. При ожидающих назначениях в чужих заявках или участии в шаблонах требуется активная замена, не являющаяся автором/другим участником затронутой заявки или участником того же шаблона. Чужие решения и имена сохраняются. Свою учётную запись администратора удалить нельзя. 409 при изменившемся числе заявок.",
            },
          "AdminRouteInput":
            {
              "type": "object",
              "properties":
                {
                  "department_id": { "$ref": "#/components/schemas/Id" },
                  "name":
                    { "type": "string", "minLength": 1, "maxLength": 150 },
                  "is_active": { "type": "boolean" },
                  "version": { "type": "integer", "minimum": 0 },
                  "approver_ids":
                    {
                      "type": "array",
                      "minItems": 1,
                      "maxItems": 20,
                      "uniqueItems": true,
                      "items": { "$ref": "#/components/schemas/Id" },
                    },
                },
              "required":
                [
                  "department_id",
                  "name",
                  "is_active",
                  "version",
                  "approver_ids",
                ],
              "description": "Новый маршрут: version=0; изменение: текущая версия. Один активный маршрут на подразделение. Отправленные заявки не меняются.",
            },
          "AdminRoute":
            {
              "type": "object",
              "properties":
                {
                  "id": { "$ref": "#/components/schemas/Id" },
                  "department_id": { "$ref": "#/components/schemas/Id" },
                  "department_name": { "type": "string" },
                  "name": { "type": "string" },
                  "is_active": { "type": "boolean" },
                  "version": { "type": "integer", "minimum": 1 },
                  "steps":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "properties":
                            {
                              "employee_id":
                                { "$ref": "#/components/schemas/Id" },
                              "full_name": { "type": "string" },
                              "step_order": { "type": "integer" },
                            },
                        },
                    },
                },
            },
          "AdminMetadata":
            {
              "type": "object",
              "properties":
                {
                  "departments":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "properties":
                            {
                              "id": { "$ref": "#/components/schemas/Id" },
                              "name": { "type": "string" },
                              "is_active": { "type": "boolean" },
                            },
                        },
                    },
                  "approvers":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/AdminEmployee" },
                    },
                },
            },
          "AdminAudit":
            {
              "type": "object",
              "properties":
                {
                  "id": { "$ref": "#/components/schemas/Id" },
                  "actor_user_id":
                    {
                      "anyOf":
                        [
                          { "$ref": "#/components/schemas/Id" },
                          { "type": "null" },
                        ],
                    },
                  "actor_name": { "type": "string" },
                  "action":
                    {
                      "enum":
                        [
                          "employee.create",
                          "employee.update",
                          "employee.delete",
                          "request.cancel",
                          "request.reassign",
                          "route.save",
                          "catalog.create",
                          "catalog.update",
                          "catalog.delete",
                        ],
                    },
                  "entity_type": { "type": "string" },
                  "entity_id": { "type": "string" },
                  "reason": { "type": "string" },
                  "details": { "type": "object" },
                  "created_at": { "type": "string", "format": "date-time" },
                },
            },
          "CatalogInput":
            {
              "type": "object",
              "properties":
                {
                  "name":
                    { "type": "string", "minLength": 1, "maxLength": 120 },
                  "code":
                    {
                      "type": "string",
                      "pattern": "^[A-Z][A-Z0-9_]*$",
                      "maxLength": 30,
                    },
                  "is_active": { "type": "boolean" },
                  "version": { "type": "integer", "minimum": 1 },
                },
              "required": ["name", "is_active"],
              "description": "code обязателен для категорий расходов; version обязателен при изменении. Отключённые значения сохраняются в существующих данных.",
            },
          "CatalogEntry":
            {
              "allOf":
                [
                  { "$ref": "#/components/schemas/CatalogInput" },
                  {
                    "type": "object",
                    "properties":
                      {
                        "id": { "$ref": "#/components/schemas/Id" },
                        "reference_count": { "type": "integer", "minimum": 0 },
                      },
                    "required": ["id", "version", "reference_count"],
                  },
                ],
            },
          "CatalogResult":
            {
              "type": "object",
              "properties":
                {
                  "items":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/CatalogEntry" },
                    },
                },
              "required": ["items"],
            },
        },
    },
}
