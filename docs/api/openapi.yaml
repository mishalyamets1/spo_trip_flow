  "info":
    {
      "title": "TripFlow API",
      "version": "0.2.0",
      "description": "Учебная версия этапов II–III. Все изменяющие запросы требуют Content-Type application/json и Origin, равный APP_ORIGIN. В режиме разработки также разрешены localhost и 127.0.0.1 на портах 3000/3001. Сессия в HttpOnly cookie на 8 часов; SameSite=Lax, Secure при COOKIE_SECURE=true. Идентификаторы BIGINT и суммы NUMERIC передаются строками. Ошибочный JSON: 400, слишком большой запрос: 413, неверный Content-Type: 415. Чужие заявки скрыты ответом 404. ADMIN-интерфейс и отмена заявок пока не реализованы.",
    },
  "servers": [{ "url": "http://localhost:3000/api" }],
  "security": [{ "session": [] }],
